version: '3.8'

services:
  redis:
    image: "redis:8.0.3-bookworm"
    container_name: cleanforum_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  redis_test:
    image: "redis:8.0.3-bookworm"
    container_name: cleanforum_redis_test
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data

volumes:
  redis_data:
  redis_test_data:
