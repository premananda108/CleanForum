[pytest]
env =
    TESTING=true
    REDIS_HOST=localhost
    REDIS_PORT=6380
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
minversion = 6.0
required_plugins = pytest-asyncio
filterwarnings =
    ignore:.*encoder_attention_mask.*:FutureWarning:torch\.nn\.modules\.module
