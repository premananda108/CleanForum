{% extends "base.html" %}

{% block title %}Создать новый пост - CleanForum{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h1><i class="fas fa-edit"></i> Создать новый пост</h1>
            </div>
            <div class="card-body">
                <form id="create-post-form">
                    <div class="mb-3">
                        <label for="post-title" class="form-label">Заголовок</label>
                        <input type="text" class="form-control" id="post-title" required>
                    </div>
                    <div class="mb-3">
                        <label for="post-content" class="form-label">Содержание</label>
                        <textarea class="form-control" id="post-content" rows="10" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="post-category" class="form-label">Категория</label>
                            <select class="form-select" id="post-category" required>
                                <!-- Категории будут загружены сюда -->
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="post-tags" class="form-label">Теги (через запятую)</label>
                            <input type="text" class="form-control" id="post-tags">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-paper-plane"></i> Опубликовать
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
