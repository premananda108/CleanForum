<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanForum</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>CleanForum</h1>
            <p>A modern forum with built-in spam protection.</p>
        </header>

        <div id="error-message" class="error" style="display:none;"></div>

        <main>
            <div class="form-container">
                <h2>Create a New Post</h2>
                <form id="new-post-form">
                    <input type="text" id="author" name="author" placeholder="Your name" required>
                    <input type="text" id="title" name="title" placeholder="Post title" required>
                    <textarea id="content" name="content" placeholder="What's on your mind?" rows="5" required></textarea>
                    <button type="submit">Submit Post</button>
                </form>
            </div>

            <div class="posts-container">
                <h2>Recent Posts</h2>
                <div id="posts-list">
                    <p>Loading posts...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', path='/js/script.js') }}"></script>
</body>
</html>
