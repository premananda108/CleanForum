{% extends "base.html" %}

{% block title %}Edit Post - CleanForum{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Hero Section -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-green-500 to-teal-600 rounded-2xl mb-4">
            <i class="fas fa-pencil-alt text-white text-2xl"></i>
        </div>
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Edit Post</h1>
        <p class="text-xl text-gray-600">Make your changes and save them</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-green-500 to-teal-600 h-1"></div>

        <div class="p-8">
            <form id="edit-post-form" class="space-y-6">
                <!-- Title -->
                <div class="space-y-2">
                    <label for="post-title" class="block text-sm font-semibold text-gray-700">Title</label>
                    <input type="text" id="post-title" required minlength="5" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-50 focus:border-green-500 transition-all">
                </div>

                <!-- Content -->
                <div class="space-y-2">
                    <label for="post-content" class="block text-sm font-semibold text-gray-700">
                        Content (Markdown supported)
                    </label>
                    <textarea
                        id="post-content"
                        required
                        minlength="10"
                        rows="12"
                        class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-50 focus:border-green-500 transition-all"
                    ></textarea>
                </div>

                <!-- Category and Tags -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="post-category" class="block text-sm font-semibold text-gray-700">Category</label>
                        <select id="post-category" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-purple-50 focus:border-purple-500 transition-all"></select>
                    </div>
                    <div class="space-y-2">
                        <label for="post-tags" class="block text-sm font-semibold text-gray-700">Tags</label>
                        <input type="text" id="post-tags" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-orange-50 focus:border-orange-500 transition-all" placeholder="comma-separated">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                    <a href="/posts/{{ post.id }}" class="text-gray-500 hover:text-gray-700 transition-colors">Cancel</a>
                    <button type="submit" class="bg-gradient-to-r from-green-500 to-teal-600 text-white px-8 py-3 rounded-xl font-semibold hover:shadow-lg transform hover:scale-105 transition-all duration-300">
                        <i class="fas fa-save mr-2"></i>
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
