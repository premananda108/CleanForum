{% extends "base.html" %}

{% block title %}Редактировать пост - CleanForum{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <!-- Hero секция -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-green-500 to-teal-600 rounded-2xl mb-4">
            <i class="fas fa-pencil-alt text-white text-2xl"></i>
        </div>
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Редактировать пост</h1>
        <p class="text-xl text-gray-600">Внесите изменения и сохраните их</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-gradient-to-r from-green-500 to-teal-600 h-1"></div>

        <div class="p-8">
            <form id="edit-post-form" class="space-y-6">
                <!-- Заголовок -->
                <div class="space-y-2">
                    <label for="post-title" class="block text-sm font-semibold text-gray-700">Заголовок</label>
                    <input type="text" id="post-title" required minlength="5" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-50 focus:border-green-500 transition-all">
                </div>

                <!-- Содержание -->
                <div class="space-y-2">
                    <label for="post-content" class="block text-sm font-semibold text-gray-700">Содержание</label>
                    <textarea id="post-content" rows="12" required minlength="10" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-green-50 focus:border-green-500 transition-all resize-none"></textarea>
                </div>

                <!-- Категория и теги -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label for="post-category" class="block text-sm font-semibold text-gray-700">Категория</label>
                        <select id="post-category" required class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-purple-50 focus:border-purple-500 transition-all"></select>
                    </div>
                    <div class="space-y-2">
                        <label for="post-tags" class="block text-sm font-semibold text-gray-700">Теги</label>
                        <input type="text" id="post-tags" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:ring-4 focus:ring-orange-50 focus:border-orange-500 transition-all" placeholder="через запятую">
                    </div>
                </div>

                <!-- Кнопка отправки -->
                <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                    <a href="/posts/{{ post.id }}" class="text-gray-500 hover:text-gray-700 transition-colors">Отмена</a>
                    <button type="submit" class="bg-gradient-to-r from-green-500 to-teal-600 text-white px-8 py-3 rounded-xl font-semibold hover:shadow-lg transform hover:scale-105 transition-all duration-300">
                        <i class="fas fa-save mr-2"></i>
                        Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const postId = '{{ post.id }}';
        const form = document.getElementById('edit-post-form');
        const titleInput = document.getElementById('post-title');
        const contentInput = document.getElementById('post-content');
        const categorySelect = document.getElementById('post-category');
        const tagsInput = document.getElementById('post-tags');

        // 1. Загрузка категорий
        try {
            const categories = await api.getCategories();
            categorySelect.innerHTML = categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
        } catch (error) {
            console.error('Error loading categories:', error);
            showAlert('Ошибка загрузки категорий', 'danger');
        }

        // 2. Загрузка данных поста
        try {
            const post = await api.getPost(postId);
            titleInput.value = post.title;
            contentInput.value = post.content;
            categorySelect.value = post.category_id;
            tagsInput.value = post.tags.join(', ');
        } catch (error) {
            console.error('Error loading post data:', error);
            showAlert('Ошибка загрузки данных поста', 'danger');
            form.innerHTML = '<p class="text-red-500">Не удалось загрузить данные для редактирования.</p>';
        }

        // 3. Обработка отправки формы
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const submitBtn = form.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Сохранение...';
            submitBtn.disabled = true;

            const postData = {
                title: titleInput.value,
                content: contentInput.value,
                category_id: categorySelect.value,
                tags: tagsInput.value.split(',').map(tag => tag.trim()).filter(tag => tag)
            };

            try {
                await api.updatePost(postId, postData);
                showAlert('Пост успешно обновлен!', 'success');
                setTimeout(() => window.location.href = `/posts/${postId}`, 1500);
            } catch (error) {
                console.error('Error updating post:', error);
                showAlert('Ошибка при обновлении поста.', 'danger');
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    });

    // Убедитесь, что у вас есть функция showAlert
    // Она может быть в вашем глобальном JS файле (forum.js)
</script>
{% endblock %}
