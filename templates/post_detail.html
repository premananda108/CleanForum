{% extends "base.html" %}

{% block title %}Просмотр поста - CleanForum{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-9">
        <!-- Контейнер для данных поста -->
        <div id="post-detail-container"></div>

        <!-- Раздел комментариев -->
        <div class="card mt-4">
            <div class="card-header">
                <h4><i class="fas fa-comments"></i> Комментарии</h4>
            </div>
            <div class="card-body">
                <div id="comments-container">
                    <!-- Комментарии будут загружены сюда -->
                </div>
            </div>
        </div>

        <!-- Форма добавления комментария -->
        <div class="card mt-4">
            <div class="card-header">
                <h5>Оставить комментарий</h5>
            </div>
            <div class="card-body">
                <form id="add-comment-form">
                    <div class="mb-3">
                        <textarea class="form-control" id="comment-content" rows="4" required minlength="5"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <!-- Можно добавить боковую панель с информацией об авторе, тегах и т.д. -->
        <div class="card">
            <div class="card-header">Информация</div>
            <div class="card-body" id="post-meta-container">
                <!-- Мета-информация о посте -->
            </div>
        </div>
        <div class="card mt-4">
            <div class="card-header">
                <h5><i class="fas fa-clone"></i> Похожие посты</h5>
            </div>
            <div class="card-body" id="similar-posts-container">
                <!-- Похожие посты будут загружены сюда -->
            </div>
        </div>
    </div>
</div>
{% endblock %}
