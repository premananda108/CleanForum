<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CleanForum - Modern Forum with Spam Protection{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d'
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'bounce-light': 'bounce 1s infinite'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
                @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Toggle A */
        input:checked ~ .dot {
            transform: translateX(100%);
            background-color: #48bb78;
        }
    </style>
    </style>
    <link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CleanForum" />
    <link rel="manifest" href="/static/site.webmanifest" />
</head>
<body class="bg-gradient-to-br from-green-50 to-amber-50 min-h-screen">
    <!-- Навигация -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-green-100 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="/" class="flex items-center space-x-2 text-primary-700 font-bold text-xl group">
                    <div class="p-2 bg-gradient-to-r from-green-500 to-yellow-500 rounded-lg text-white group-hover:shadow-lg transition-all duration-300">
                        <i class="fas fa-shield-alt"></i>
                    </div>
                    <span class="bg-gradient-to-r from-green-600 to-yellow-600 bg-clip-text text-transparent">CleanForum</span>
                </a>

                <div class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-4 py-2 rounded-lg text-gray-600 hover:text-green-600 hover:bg-green-50 transition-all duration-200 font-medium">
                        <i class="fas fa-home mr-2"></i>Home
                    </a>
                    <a href="/create" class="px-4 py-2 rounded-lg text-gray-600 hover:text-green-600 hover:bg-green-50 transition-all duration-200 font-medium">
                        <i class="fas fa-plus mr-2"></i>Create Post
                    </a>
                    <form action="/search" method="GET" class="relative">
                        <input type="search" name="q" placeholder="Search..." class="py-2 pl-10 pr-4 rounded-lg text-gray-700 bg-gray-50 border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary-500" required minlength="2">
                        <button type="submit" class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 hover:text-primary-600">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                    <a href="/moderator" class="px-4 py-2 rounded-lg bg-gradient-to-r from-green-500 to-yellow-500 text-white hover:shadow-lg transition-all duration-300 font-medium">
                        <i class="fas fa-user-shield mr-2"></i>Moderation
                    </a>
                </div>

                <!-- Mobile menu button -->
                <div class="md:hidden">
                    <button id="mobile-menu-button" class="p-2 rounded-lg text-gray-600 hover:text-green-600 hover:bg-green-50 transition-colors">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile menu, show/hide based on menu state. -->
        <div id="mobile-menu" class="hidden md:hidden">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="/" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-green-600 hover:bg-green-50">
                    <i class="fas fa-home mr-2"></i>Home
                </a>
                <a href="/create" class="block px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-green-600 hover:bg-green-50">
                    <i class="fas fa-plus mr-2"></i>Create Post
                </a>
                <div class="px-2 pt-1 pb-2">
                    <form action="/search" method="GET" class="relative">
                        <input type="search" name="q" placeholder="Search..." class="w-full py-2 pl-10 pr-4 rounded-lg text-gray-700 bg-gray-100 border-transparent focus:outline-none focus:ring-2 focus:ring-primary-500" required minlength="2">
                        <button type="submit" class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500 hover:text-primary-600">
                            <i class="fas fa-search"></i>
                        </button>
                    </form>
                </div>
                <a href="/moderator" class="block px-3 py-2 rounded-md text-base font-medium bg-gradient-to-r from-green-500 to-yellow-500 text-white hover:shadow-lg transition-all duration-300">
                    <i class="fas fa-user-shield mr-2"></i>Moderation
                </a>
            </div>
        </div>
    </nav>

    <!-- Основной контент -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-yellow-200 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="text-center">
                <div class="flex items-center justify-center space-x-2 mb-4">
                    <div class="w-8 h-8 bg-gradient-to-r from-green-500 to-yellow-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-shield-alt text-white text-sm"></i>
                    </div>
                    <span class="text-gray-800 font-semibold">CleanForum</span>
                </div>
                <p class="text-gray-600">&copy; 2025 CleanForum. Powered by FastAPI + Redis Vector Search</p>
                <div class="mt-4 flex justify-center space-x-6 text-sm text-gray-500">
                    <span class="flex items-center"><i class="fas fa-robot mr-1"></i> AI-Powered Spam Detection</span>
                    <span class="flex items-center"><i class="fas fa-tachometer-alt mr-1"></i> Real-time Performance</span>
                    <span class="flex items-center"><i class="fas fa-shield-alt mr-1"></i> Advanced Security</span>
                </div>
            </div>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', path='js/forum.js') }}"></script>
</body>
</html>
